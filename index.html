<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ben Joshi</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;600&display=swap');

    :root {
      --bg: #101010;
      --text: #f1f0ec;
      --muted: #8d9294;
      --line: #303030;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .landing {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-columns: 1fr 0.8fr;
      gap: 8vw;
      align-items: center;
      padding: 5vw;
    }

    /* LEFT */

    .intro {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(3.5rem, 7vw, 7.5rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.95;
      margin-bottom: 5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      font-size: clamp(1.25rem, 1.7vw, 1.7rem);
      color: var(--muted);
      transition:
        color 250ms ease,
        transform 250ms ease;
    }

    .link span {
      transition: transform 250ms ease;
    }

    .link:hover {
      color: var(--text);
      transform: translateX(4px);
    }

    .link:hover span {
      transform: translateX(5px);
    }

    /* PHOTO */

    .portrait {
      width: min(100%, 520px);
      justify-self: center;
      position: relative;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Small detail */

    .corner {
      position: fixed;
      bottom: 2rem;
      left: 5vw;
      color: #666;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .landing {
        grid-template-columns: 1fr;
        gap: 4rem;
        padding: 2rem 1.5rem 5rem;
      }

      .intro {
        order: 1;
      }

      .portrait {
        order: 2;
        width: min(100%, 430px);
      }

      .name {
        font-size: clamp(3.5rem, 17vw, 6rem);
        margin-bottom: 3.5rem;
      }

      .links {
        gap: 1.25rem;
      }

      .link {
        font-size: 1.25rem;
      }

      .corner {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <section class="intro">

      <h1 class="name">
        Ben Joshi
      </h1>

      <nav class="links" aria-label="Main navigation">

        <a class="link" href="/software">
          Software &amp; Data
          <span aria-hidden="true">→</span>
        </a>

        <a class="link" href="/music">
          Music
          <span aria-hidden="true">→</span>
        </a>

      </nav>

    </section>


    <figure class="portrait">
      <img
        src="images/headshot.jpg"
        alt="Ben Joshi"
      >
    </figure>

  </main>

  <div class="corner">
    benjoshi.co.uk
  </div>

</body>
</html>
